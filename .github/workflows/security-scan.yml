name: Terraform security scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov S3 public-access gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enforce the S3 public-access block
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          check: CKV2_AWS_6
          soft_fail: false
          output_format: cli

      - name: Report all other Terraform findings
        if: always()
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli
